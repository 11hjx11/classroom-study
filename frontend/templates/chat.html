<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassVision Agent - 课堂学情分析智能体</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e1a;
            color: #e8eaed;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            background: #0f1420;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: linear-gradient(135deg, #1a2332 0%, #0f1420 100%);
            border-bottom: 1px solid #2a3444;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .chat-title h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .chat-title p {
            margin: 0;
            font-size: 12px;
            color: #8b95a7;
        }

        .chat-header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: #2a3444;
            border: none;
            color: #8b95a7;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: #3a4556;
            color: #fff;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #2a3444;
            border-radius: 3px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .message.agent .message-avatar {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .message-content {
            background: #1a2332;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #5a67d8 100%);
            color: #fff;
        }

        .message.agent .message-content {
            background: #1e2a3a;
            border: 1px solid #2a3444;
        }

        .message-content strong { color: #7dd3fc; }
        .message-content code {
            background: #0a0e1a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: #fbbf24;
        }

        .message-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0;
        }
        .message-content table th,
        .message-content table td {
            border: 1px solid #2a3444;
            padding: 6px 10px;
            text-align: left;
        }
        .message-content table th {
            background: #2a3444;
            color: #7dd3fc;
        }

        .tool-call-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #2a3444;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #fbbf24;
            margin: 4px 0;
        }

        .tool-result {
            background: #162028;
            border-left: 3px solid #38ef7d;
            padding: 8px 12px;
            margin: 6px 0;
            border-radius: 0 8px 8px 0;
            font-size: 13px;
        }

        .tool-error {
            background: #2a1628;
            border-left: 3px solid #f87171;
            padding: 8px 12px;
            margin: 6px 0;
            border-radius: 0 8px 8px 0;
            font-size: 13px;
        }

        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #8b95a7;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        .chat-input-area {
            padding: 16px 20px;
            background: #0f1420;
            border-top: 1px solid #2a3444;
        }

        .chat-input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: #1a2332;
            border: 1px solid #2a3444;
            border-radius: 12px;
            padding: 8px 12px;
            transition: border-color 0.2s;
        }

        .chat-input-container:focus-within {
            border-color: #667eea;
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e8eaed;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            min-height: 24px;
            outline: none;
            line-height: 1.5;
        }

        .chat-input::placeholder {
            color: #5a6778;
        }

        .chat-send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .chat-send:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .chat-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .quick-prompts {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .quick-prompt {
            background: #1a2332;
            border: 1px solid #2a3444;
            color: #8b95a7;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-prompt:hover {
            background: #2a3444;
            color: #fff;
            border-color: #667eea;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 20px;
            background: #0a0e1a;
            border-top: 1px solid #1a2332;
            font-size: 12px;
            color: #5a6778;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #38ef7d;
            border-radius: 50%;
        }

        .status-dot.thinking {
            background: #fbbf24;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            padding: 40px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state h2 {
            color: #fff;
            margin: 0 0 8px 0;
            font-size: 20px;
        }

        .empty-state p {
            color: #8b95a7;
            margin: 0 0 24px 0;
            font-size: 14px;
        }

        .feature-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 500px;
            width: 100%;
        }

        .feature-card {
            background: #1a2332;
            border: 1px solid #2a3444;
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .feature-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .feature-card-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature-card-title {
            color: #fff;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .feature-card-desc {
            color: #8b95a7;
            font-size: 12px;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                max-width: 100%;
            }
            .feature-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="chat-logo">🤖</div>
                <div class="chat-title">
                    <h1>ClassVision Agent</h1>
                    <p>课堂学情分析智能体</p>
                </div>
            </div>
            <div class="chat-header-actions">
                <button class="btn-icon" onclick="resetChat()" title="重置对话">
                    ↺
                </button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">🎓</div>
                <h2>课堂学情分析智能体</h2>
                <p>我可以分析课堂视频、计算学情指标、生成专业报告<br>试试下面的快捷操作，或直接输入你的问题</p>
                <div class="feature-cards">
                    <div class="feature-card" onclick="sendQuickPrompt('列出 uploads 目录下的视频')">
                        <div class="feature-card-icon">📹</div>
                        <div class="feature-card-title">浏览视频</div>
                        <div class="feature-card-desc">查看可用的课堂视频文件</div>
                    </div>
                    <div class="feature-card" onclick="sendQuickPrompt('分析 uploads 下最新的视频，生成完整报告')">
                        <div class="feature-card-icon">🔍</div>
                        <div class="feature-card-title">一键分析</div>
                        <div class="feature-card-desc">自动完成视频分析+报告生成</div>
                    </div>
                    <div class="feature-card" onclick="sendQuickPrompt('列出已有的 CSV 数据文件')">
                        <div class="feature-card-icon">📊</div>
                        <div class="feature-card-title">查看数据</div>
                        <div class="feature-card-desc">浏览历史分析的 CSV 数据</div>
                    </div>
                    <div class="feature-card" onclick="sendQuickPrompt('对比两份 CSV 数据的学情差异')">
                        <div class="feature-card-icon">⚖️</div>
                        <div class="feature-card-title">对比分析</div>
                        <div class="feature-card-desc">对比不同课程的学情指标</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">准备就绪</span>
        </div>

        <div class="chat-input-area">
            <div class="chat-input-container">
                <textarea
                    class="chat-input"
                    id="chatInput"
                    placeholder="输入你的问题，例如：分析视频前15分钟的专注度..."
                    rows="1"
                    onkeydown="handleKeyDown(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button class="chat-send" id="sendBtn" onclick="sendMessage()">
                    ➤
                </button>
            </div>
            <div class="quick-prompts">
                <div class="quick-prompt" onclick="sendQuickPrompt('分析 uploads/ 下最新视频的前15分钟')">⏱ 分析前15分钟</div>
                <div class="quick-prompt" onclick="sendQuickPrompt('对比两份 CSV 数据的学情差异')">⚖ 对比分析</div>
                <div class="quick-prompt" onclick="sendQuickPrompt('生成一份完整的学情分析报告')">📝 生成报告</div>
                <div class="quick-prompt" onclick="sendQuickPrompt('查看历史 CSV 数据')">📂 历史数据</div>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const emptyState = document.getElementById('emptyState');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        let isProcessing = false;

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function sendQuickPrompt(text) {
            chatInput.value = text;
            sendMessage();
        }

        function setStatus(text, thinking) {
            statusText.textContent = text;
            if (thinking) {
                statusDot.classList.add('thinking');
            } else {
                statusDot.classList.remove('thinking');
            }
        }

        function addUserMessage(text) {
            if (emptyState) emptyState.style.display = 'none';
            const div = document.createElement('div');
            div.className = 'message user';
            div.innerHTML = `
                <div class="message-avatar">👤</div>
                <div class="message-content"></div>
            `;
            div.querySelector('.message-content').textContent = text;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function addAgentMessage() {
            if (emptyState) emptyState.style.display = 'none';
            const div = document.createElement('div');
            div.className = 'message agent';
            div.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content"></div>
            `;
            chatMessages.appendChild(div);
            scrollToBottom();
            return div.querySelector('.message-content');
        }

        function addTypingIndicator() {
            const div = document.createElement('div');
            div.className = 'message agent';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function addToolCall(toolName) {
            const div = document.createElement('div');
            div.className = 'message agent';
            div.innerHTML = `
                <div class="message-avatar">🔧</div>
                <div class="message-content">
                    <div class="tool-call-indicator">⚙ 调用工具: ${toolName}</div>
                </div>
            `;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function addToolResult(toolName, summary, success) {
            const div = document.createElement('div');
            div.className = 'message agent';
            const cls = success ? 'tool-result' : 'tool-error';
            const icon = success ? '✓' : '✗';
            div.innerHTML = `
                <div class="message-avatar">${success ? '✓' : '✗'}</div>
                <div class="message-content">
                    <div class="${cls}">${icon} ${toolName}: ${summary || (success ? '执行成功' : '执行失败')}</div>
                </div>
            `;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || isProcessing) return;

            isProcessing = true;
            sendBtn.disabled = true;
            addUserMessage(text);
            chatInput.value = '';
            autoResize(chatInput);

            setStatus('正在处理...', true);

            try {
                const response = await fetch('/api/chat_stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                });

                if (!response.ok) {
                    throw new Error('网络错误: ' + response.status);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let currentContent = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const dataStr = line.slice(6);
                        if (dataStr === '[DONE]') continue;

                        try {
                            const event = JSON.parse(dataStr);
                            handleEvent(event);
                        } catch (e) {
                            console.error('Parse error:', dataStr, e);
                        }
                    }
                }
            } catch (error) {
                removeTypingIndicator();
                const contentEl = addAgentMessage();
                contentEl.textContent = '❌ 请求失败: ' + error.message;
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                setStatus('准备就绪', false);
                chatInput.focus();
            }
        }

        function handleEvent(event) {
            const type = event.type;
            const data = event.data;
            const message = event.message;

            switch (type) {
                case 'status':
                    setStatus(message || data, type === 'thinking' || type === 'calling_llm');
                    break;

                case 'tool_call':
                    removeTypingIndicator();
                    const tools = (data && data.tools) || [];
                    const toolNames = tools.join(', ');
                    if (toolNames) {
                        addToolCall(toolNames);
                    }
                    setStatus('执行工具中...', true);
                    break;

                case 'token':
                    // Token 级流式输出：逐 token 追加到当前 Agent 消息
                    removeTypingIndicator();
                    let tokenEl = document.querySelector('.message.agent:last-of-type .message-content');
                    if (!tokenEl || (!tokenEl.textContent && !tokenEl.innerHTML.trim())) {
                        const msgEl = addAgentMessage();
                        msgEl.textContent = '';
                        tokenEl = msgEl;
                    }
                    if (tokenEl) {
                        tokenEl.textContent = (tokenEl.textContent || '') + (data || '');
                    }
                    scrollToBottom();
                    break;

                case 'content':
                    removeTypingIndicator();
                    let contentEl = document.querySelector('.message.agent:last-of-type .message-content');
                    if (!contentEl || !contentEl.textContent && !contentEl.innerHTML.trim()) {
                        const msgEl = addAgentMessage();
                        msgEl.textContent = '';
                        contentEl = msgEl;
                    }
                    if (contentEl) {
                        contentEl.textContent = (contentEl.textContent || '') + (data || '');
                    }
                    scrollToBottom();
                    break;

                case 'reflection':
                    // 反思节点反馈：回答质量不达标，正在重试
                    if (data && data.feedback) {
                        addToolCall(`反思 #${data.count || 1}: ${data.feedback}`);
                    }
                    setStatus(message || '反思改进中...', true);
                    break;

                case 'tool_result':
                    if (data && data.tool) {
                        addToolResult(data.tool, data.summary, true);
                    }
                    break;

                case 'tool_error':
                    if (data && data.tool) {
                        addToolResult(data.tool, data.error, false);
                    }
                    break;

                case 'error':
                    removeTypingIndicator();
                    const errEl = addAgentMessage();
                    errEl.textContent = '❌ 发生错误: ' + (message || data || '未知错误');
                    break;

                case 'done':
                    setStatus('分析完成', false);
                    break;
            }
        }

        async function resetChat() {
            try {
                await fetch('/api/chat/reset', { method: 'POST' });
                chatMessages.innerHTML = '';
                location.reload();
            } catch (e) {
                console.error(e);
            }
        }

        chatInput.focus();
    </script>
</body>
</html>
