video:
  input_dir: "inputs/"
  supported_formats: [".mp4", ".avi", ".mov"]

sampling:
  frame_interval_sec: 3
  max_frames: 1000

detection:
  model: "yolov8l.pt"
  conf_threshold: 0.15
  iou_threshold: 0.45
  img_size: 1280
  max_det: 100
  min_bbox_area_ratio: 0.0015
  max_bbox_area_ratio: 0.4

segments:
  - name: "上课初期"
    ratio: [0, 0.25]
  - name: "上课关键期"
    ratio: [0.25, 0.5]
  - name: "疲劳期"
    ratio: [0.5, 0.75]
  - name: "临近下课期"
    ratio: [0.75, 1.0]

output:
  cache_csv: "outputs/csv/"
