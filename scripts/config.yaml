video:
  input_dir: "inputs/"
  supported_formats: [".mp4", ".avi"]

sampling:
  frame_interval_sec: 3
  max_frames: 1000

detection:
  model: "yolov8n.pt"
  conf_threshold: 0.3

head_pose:
  pitch_up: 15
  pitch_down: -10
  yaw_side: 20

segments:
  - name: "初期"
    ratio: [0, 0.25]
  - name: "黄金时期"
    ratio: [0.25, 0.5]
  - name: "疲惫期"
    ratio: [0.5, 0.75]
  - name: "结尾期"
    ratio: [0.75, 1.0]

output:
  cache_csv: "cache_csv/"
